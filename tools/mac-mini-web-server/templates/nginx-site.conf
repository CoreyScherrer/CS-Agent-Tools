# ops/nginx/sites/example.com.conf  — kept in git, SYMLINKED into $(brew --prefix)/etc/nginx/servers/
# Never `sudo cp` over the symlink (it becomes a plain file and the next deploy edits the wrong one).
# `nginx -t` before every reload, always.

# Named upstream only. Never a literal 127.0.0.1:PORT inside proxy_pass.
upstream app_example { server 127.0.0.1:5001; }

server {
    listen 127.0.0.1:443 ssl;          # loopback only; the tunnel is the only client
    http2 on;
    server_name example.com www.example.com;   # every hostname routed in the tunnel needs a vhost

    # Cloudflare Origin CA cert for the zone (15-year). Not Let's Encrypt; nothing inbound to renew.
    ssl_certificate     /var/acme/tls/example.com.origin.pem;
    ssl_certificate_key /var/acme/tls/example.com.origin.key;

    # Behind the tunnel every request comes from loopback. Without this, logs and
    # rate limits see one IP for everybody.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Logs OUTSIDE /var/log (an OS update deleted /var/log/nginx; nginx -t then failed; apex 502).
    access_log /var/acme/logs/nginx/example.com.access.log;
    error_log  /var/acme/logs/nginx/example.com.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/example/public;

    # ONE Cache-Control source. Do not combine `expires` with `add_header Cache-Control`:
    # nginx emits both and the CDN picks the more aggressive (a year of `immutable` on changing files).
    location ~* \.(css|js|png|jpg|svg|woff2)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        proxy_pass http://app_example;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check that reaches a WORKER (the gunicorn master answers while workers crash-loop).
    location = /health { proxy_pass http://app_example/health; }

    # Defence in depth: dev-only paths never served from the public hostname. An auth gate is not separation.
    location ^~ /dev/   { return 404; }
    location ^~ /.git   { return 404; }
}

server {
    listen 127.0.0.1:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}
