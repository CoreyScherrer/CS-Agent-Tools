# Secret-scan settings for this repo: gitleaks' default rules, with one reviewed exception.
[extend]
useDefault = true

[allowlist]
description = "Floorplan's Health check has a test that builds made-up private keys ('MIIE' + 'abcd' repeated, plain and passphrase-protected) to prove the check reports the plain one and leaves the protected ones alone. They are fixtures, not keys."
paths = ['''^tools/floorplan/tests/false-positives\.test\.mjs$''']
regexes = ['''BEGIN (RSA|ENCRYPTED) PRIVATE KEY-----\\n\$\{body\}''']
condition = "AND"
